[pytest]
# Run all async tests/fixtures on a single session-scoped event loop so that
# asyncpg connections created by the shared test engine stay on one loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: requires a running Ollama with the embedding model pulled (deselect with -m "not integration")
