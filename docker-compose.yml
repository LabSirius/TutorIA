# TutorIA — local development stack
# PostgreSQL with the pgvector extension is the single, unified datastore:
# relational data, semantic vectors (RAG) and pedagogical prompts all live here.
# Ollama runs the local LLM + embedding model, mirroring the production Azure
# setup (dev-prod parity, zero-install onboarding).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tutoria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutoria
      POSTGRES_PASSWORD: tutoria
      POSTGRES_DB: tutoria
    ports:
      - "5432:5432"
    volumes:
      - tutoria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutoria -d tutoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: tutoria_ollama
    restart: unless-stopped
    ports:
      # Exposed to the host so a host-run backend (uvicorn) and debugging tools
      # can reach it at http://localhost:11434.
      - "11434:11434"
    volumes:
      - tutoria_ollama_data:/root/.ollama
    healthcheck:
      # The ollama image ships no curl/wget; `ollama list` calls GET /api/tags
      # under the hood and exits non-zero unless the server responds 200.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot init: waits for ollama to be healthy, pulls the embedding model
  # into the shared volume, then exits. Ollama does not auto-pull models.
  ollama-init:
    image: ollama/ollama:latest
    container_name: tutoria_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Point the CLI at the server container so the pull lands in its volume.
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text"]
    restart: "no"

  # Local mock of Open edX's MongoDB, for developing/testing the RF-22 gateway
  # without a real Open edX instance. Commented out by default to keep the dev
  # environment light. To use it: uncomment this service and the volume below,
  # run `docker compose up -d openedx-mongo`, and set in backend/.env:
  #   OPENEDX_MONGO_URL=mongodb://localhost:27017
  #   OPENEDX_MONGO_DB=edxapp
  # openedx-mongo:
  #   image: mongo:6.0
  #   container_name: tutoria_openedx_mongo
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - tutoria_openedx_mongo_data:/data/db
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  tutoria_pgdata:
  tutoria_ollama_data:
  # tutoria_openedx_mongo_data:
